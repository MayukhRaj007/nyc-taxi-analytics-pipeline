version: 2

models:
  - name: stg_yellow_trips
    description: >
      Cleaned yellow-taxi trips: columns renamed and typed, money as decimal(10,2),
      and rows dropped when they cannot be a real completed trip (negative fares,
      dropoff before pickup, trips of 24h or more, absurd fares/distances, pickups
      outside the file's month). Grain: one row per trip.
    columns:
      - name: trip_id
        description: Deterministic md5 surrogate key built from vendor, timestamps, zones, distance and amounts (the feed has no native id).
        tests:
          - not_null
      - name: vendor_id
        description: TPEP provider code.
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 6, 7]
      - name: pickup_ts
        description: Timestamp the meter was engaged.
        tests:
          - not_null
      - name: dropoff_ts
        description: Timestamp the meter was disengaged. Never earlier than pickup_ts and always less than 24h later.
        tests:
          - not_null
      - name: passenger_count
        description: Passenger count entered by the driver (null when not entered).
      - name: trip_distance_miles
        description: Taximeter distance in miles (0 to the configured maximum).
      - name: rate_code_id
        description: Final rate code (1 standard, 2 JFK, 3 Newark, 4 Nassau/Westchester, 5 negotiated, 6 group, 99 unknown).
      - name: store_and_fwd_flag
        description: Y if the record was held in vehicle memory before being sent.
      - name: pickup_location_id
        description: TLC zone id where the trip started.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_taxi_zones')
                field: location_id
      - name: dropoff_location_id
        description: TLC zone id where the trip ended.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_taxi_zones')
                field: location_id
      - name: payment_type_id
        description: TLC payment type code.
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6]
      - name: fare_amount
        description: Metered fare in USD, between 0 and the configured maximum.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1000
      - name: extra_amount
        description: Rush-hour and overnight extras in USD (nulls become 0).
      - name: mta_tax_amount
        description: MTA tax in USD (nulls become 0).
      - name: tip_amount
        description: Tip in USD. Only card tips are recorded by the meter.
      - name: tolls_amount
        description: Tolls in USD (nulls become 0).
      - name: improvement_surcharge_amount
        description: Improvement surcharge in USD (nulls become 0).
      - name: congestion_surcharge_amount
        description: NYS congestion surcharge in USD (nulls become 0).
      - name: airport_fee_amount
        description: Airport pickup fee in USD (nulls become 0).
      - name: cbd_congestion_fee_amount
        description: MTA Congestion Relief Zone fee in USD (nulls become 0; only exists from 2025).
      - name: total_amount
        description: Total charged to the passenger in USD, excluding cash tips.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1000
      - name: source_month
        description: First day of the month of the source file; matches the pickup month by construction.
      - name: loaded_at
        description: When the row was inserted into raw by the loader.

  - name: stg_taxi_zones
    description: Cleaned TLC taxi zone lookup (265 zones), one row per zone id.
    columns:
      - name: location_id
        description: TLC zone id (1-265).
        tests:
          - not_null
          - unique
      - name: borough
        description: NYC borough name, or "Unknown" / "N/A" for the two catch-all zones.
        tests:
          - not_null
      - name: zone
        description: Zone name, e.g. "JFK Airport".
        tests:
          - not_null
      - name: service_zone
        description: TLC service area (Yellow Zone, Boro Zone, Airports, EWR, N/A).
