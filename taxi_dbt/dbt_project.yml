name: taxi_dbt
version: "1.0.0"
config-version: 2
profile: taxi_dbt

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Staging sanity bounds. TLC data contains meter glitches (e.g. a $863k fare,
  # a 320,000-mile trip); anything above these is treated as invalid and dropped.
  max_fare_usd: 1000
  max_trip_miles: 200
  # Fallback re-processing window for fct_trips when no explicit month is given.
  incremental_lookback_days: 3
  # Airflow passes start_date / end_date (half-open) for the month being loaded:
  #   dbt run --vars '{"start_date": "2025-01-01", "end_date": "2025-02-01"}'

seeds:
  taxi_dbt:
    +schema: raw
    taxi_zone_lookup:
      +column_types:
        LocationID: integer
        Borough: varchar
        Zone: varchar
        service_zone: varchar

models:
  taxi_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
